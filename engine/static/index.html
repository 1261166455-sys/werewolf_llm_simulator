<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werewolf Operator Console</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f27;
    --panel-2: #232733;
    --line: #2f3442;
    --fg: #e6e8ee;
    --dim: #8b93a7;
    --accent: #6ea8fe;
    --warn: #f0b132;
    --danger: #f2647c;
    --ok: #59c98a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    /* header, setup panel, board+log, prompt bar */
    grid-template-rows: auto auto 1fr auto;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .pill {
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    font-size: 12px;
    color: var(--dim);
  }
  .pill.running { color: var(--accent); border-color: var(--accent); }
  .pill.replaying { color: var(--warn); border-color: var(--warn); }
  .pill.finished { color: var(--ok); border-color: var(--ok); }
  .pill.error { color: var(--danger); border-color: var(--danger); }
  .spacer { flex: 1; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  label { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 4px; }
  input[type=number], input[type=text] {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--fg);
    border-radius: 6px;
    padding: 5px 8px;
    font: inherit;
  }
  input[type=number] { width: 84px; }
  input[type=text] { flex: 1; }
  button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--fg);
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #10131a; font-weight: 600; }
  button.primary:hover { color: #10131a; filter: brightness(1.08); }
  button.choice { min-width: 44px; }
  main { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
  .board {
    padding: 12px;
    border-right: 1px solid var(--line);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--panel);
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    background: var(--panel-2);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .card .pid { font-weight: 700; }
  .card .job { color: var(--dim); font-size: 12px; }
  .card .state { margin-left: auto; font-size: 11px; color: var(--ok); }
  .card[data-state=Dead] { opacity: .55; }
  .card[data-state=Dead] .state { color: var(--danger); }
  .card[data-state=Exit] { opacity: .35; text-decoration: line-through; }
  .card[data-state=Exit] .state { color: var(--dim); }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card[data-job=Wolf] .job { color: var(--danger); }
  .card .job.concealed { opacity: .45; letter-spacing: .06em; }
  .card .badge {
    font-size: 10px;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 4px;
    padding: 0 3px;
  }
  .seat {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 6px;
    padding: 4px 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .seat.llm { border-color: var(--accent); color: var(--accent); }
  details.setup {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  details.setup summary {
    cursor: pointer;
    padding: 6px 16px;
    color: var(--dim);
  }
  details.setup .setup-body {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 4px 16px 12px;
  }
  .setup-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .log { overflow-y: auto; padding: 12px 16px; }
  .line { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
  .line.prompt { color: var(--accent); margin-top: 6px; }
  .line.prompt.masked { color: var(--dim); }
  .line.decision { color: var(--ok); }
  .line.reasoning { color: var(--dim); font-style: italic; padding-left: 18px; }
  .line.speech { color: var(--fg); padding-left: 18px; }
  .line.promptdump {
    color: var(--dim);
    border-left: 2px solid var(--line);
    padding-left: 10px;
    margin: 4px 0;
    white-space: pre-wrap;
    font-size: 12px;
  }
  .line.answer { color: var(--dim); }
  .line.notice { color: var(--warn); font-style: italic; }
  .line.history { color: var(--dim); border-left: 2px solid var(--line); padding-left: 10px; margin: 8px 0; }
  .line.status { color: var(--ok); margin-top: 6px; }
  footer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 16px;
    min-height: 58px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
  }
  .waiting { color: var(--dim); font-style: italic; }
  .prompt-title { color: var(--accent); flex: 1 1 320px; }
  .choices { display: flex; gap: 6px; flex-wrap: wrap; flex: 0 0 auto; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">狼人杀操作台</h1>
  <span class="pill" id="status">connecting…</span>
  <span class="pill" id="seed"></span>
  <div class="spacer"></div>
  <div class="controls">
    <label><span data-i18n="seed">种子</span> <input type="number" id="seed-input" data-i18n-placeholder="randomSeed" placeholder="随机"></label>
    <button class="primary" id="new" data-i18n="newGame">新游戏</button>
    <label><span data-i18n="replayDelay">回放间隔</span> <input type="number" id="delay" value="0.3" step="0.1" min="0"></label>
    <button id="replay" data-i18n="replayLast">回放上一局</button>
    <button id="export" data-i18n="exportGame">导出本局</button>
    <label><span data-i18n="replayFiles">导出文件</span>
      <select id="replay-files"></select>
    </label>
    <button id="replay-file" data-i18n="replaySelected">回放所选</button>
    <label><input type="checkbox" id="autoplay"> <span data-i18n="autoplay">自动操作</span></label>
    <label><span data-i18n="language">语言</span>
      <select id="lang">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
</header>

<details class="setup" id="setup">
  <summary id="setup-summary">Model &amp; seats</summary>
  <div class="setup-body">
    <div class="setup-group">
      <span data-i18n="seats">座位</span>
      <span id="seat-buttons"></span>
    </div>
    <div class="setup-group">
      <label><span data-i18n="api">接口</span>
        <select id="llm-kind">
          <option value="deepseek">deepseek</option>
          <option value="openai">openai</option>
          <option value="anthropic">anthropic</option>
          <option value="compatible">other (openai-compatible)</option>
        </select>
      </label>
      <label><span data-i18n="model">模型</span> <input type="text" id="llm-model" size="22" placeholder="deepseek-chat"></label>
      <label><span data-i18n="baseUrl">接口地址</span> <input type="text" id="llm-base" size="30" data-i18n-placeholder="providerDefault" placeholder="使用默认地址"></label>
      <label><span data-i18n="key">密钥</span> <input type="password" id="llm-key" size="18" data-i18n-placeholder="keyEnv" placeholder="或设置 DEEPSEEK_API_KEY"></label>
      <button id="llm-test" data-i18n="testConnection">测试连接</button>
      <label><input type="checkbox" id="show-prompts"> <span data-i18n="showPrompts">显示提示词</span></label>
      <label><input type="checkbox" id="reveal-jobs"> <span data-i18n="revealJobs">公开显示身份</span></label>
    </div>
  </div>
</details>

<main>
  <section class="board" id="board"></section>
  <section class="log" id="log"></section>
</main>

<footer id="promptbar"></footer>

<script>
const el = id => document.getElementById(id);
const logEl = el('log'), boardEl = el('board'), barEl = el('promptbar');
const statusEl = el('status'), seedEl = el('seed');

let socket = null;
let pending = false;       // the server is blocked waiting for an answer
let replaying = false;     // a replayed game feeds its own answers
let activePlayer = null;
let lastPlayers = [];      // last board snapshot, so the ring can be redrawn
let lastPrompt = null;     // the prompt currently awaiting an answer
let lastPromptLine = null; // the transcript line for that prompt
let lastPromptText = '';

// -- language --------------------------------------------------------------
// The server translates engine text and the model prompt; this table covers the
// console's own chrome. Both sides switch together on the 'language' event.
const I18N = {
  zh: {
    title: '狼人杀操作台', language: '语言', seed: '种子', randomSeed: '随机',
    newGame: '新游戏', replayDelay: '回放间隔', replayLast: '回放上一局',
    autoplay: '自动操作', setup: '模型与座位', summary: '{human} 名真人 / {model} 名模型',
    seats: '座位', api: '接口', model: '模型', baseUrl: '接口地址', key: '密钥',
    keyStored: '密钥已保存', keyEnv: '或设置 DEEPSEEK_API_KEY', providerDefault: '使用默认地址',
    testConnection: '测试连接', showPrompts: '显示提示词', revealJobs: '公开显示身份',
    exportGame: '导出本局', replayFiles: '导出文件', replaySelected: '回放所选',
    noExports: '（暂无导出文件）', steps: '{n} 步', send: '发送', message: '发言内容',
    waiting: '等待引擎…', modelDeciding: '模型思考中…', replaying: '回放中…',
    thinking: '正在决策', cycle: '第 {n} 轮', human: '真人', modelSeat: '模型',
    blank: '（空）', pass: '弃权', skipGiveUp: '弃权（不投票）', skipSave: '不使用解药',
    skipKill: '不使用毒药', skip: '跳过', chose: '选择了 {value}', says: '说：{text}',
    reasoning: '推理：', autoSpeech: '大家好，我先听听各位的想法。',
    role: '[身份]',
    jobWolf: '狼人', jobProphet: '预言家', jobWitch: '女巫', jobCivilian: '平民',
    stateAlive: '存活', stateDead: '死亡', stateExit: '出局',
    stageInit: '初始化', stageReady: '初始化完成', stageNight: '夜晚', stageDay: '白天',
    endCivilian: '好人阵营获胜', endWolf: '狼人阵营获胜', endTie: '平局',
    runIdle: '空闲', runRunning: '进行中', runReplaying: '回放中', runFinished: '已结束', runError: '错误',
    kindKill: '击杀', kindSave: '救人', kindQuery: '查验', kindVote: '投票',
    kindSpeech: '发言', kindGeneric: '行动',
  },
  en: {
    title: 'Werewolf Operator Console', language: 'language', seed: 'seed', randomSeed: 'random',
    newGame: 'New game', replayDelay: 'replay delay', replayLast: 'Replay last',
    autoplay: 'autoplay', setup: 'Model & seats', summary: '{human} human / {model} model',
    seats: 'seats', api: 'api', model: 'model', baseUrl: 'base url', key: 'key',
    keyStored: 'key stored', keyEnv: 'or set DEEPSEEK_API_KEY', providerDefault: 'provider default',
    testConnection: 'Test connection', showPrompts: 'show prompts', revealJobs: 'reveal all roles',
    exportGame: 'Export game', replayFiles: 'exports', replaySelected: 'Replay selected',
    noExports: '(no exports yet)', steps: '{n} steps', send: 'Send', message: 'message',
    waiting: 'waiting for the engine…', modelDeciding: 'model is deciding…', replaying: 'replaying…',
    thinking: 'is deciding', cycle: 'cycle {n}', human: 'human', modelSeat: 'model',
    blank: '(blank)', pass: 'to pass', skipGiveUp: 'skip (give up)', skipSave: 'skip save',
    skipKill: 'skip kill', skip: 'skip', chose: 'chose {value}', says: 'says "{text}"',
    reasoning: 'reasoning: ', autoSpeech: 'hello everyone, I am listening first.',
    role: '[role]',
    jobWolf: 'Wolf', jobProphet: 'Prophet', jobWitch: 'Witch', jobCivilian: 'Civilian',
    stateAlive: 'Alive', stateDead: 'Dead', stateExit: 'Exit',
    stageInit: 'Initializing', stageReady: 'Finished_Initializing', stageNight: 'Night', stageDay: 'Day',
    endCivilian: 'End_Civilian_Win', endWolf: 'End_Wolf_Win', endTie: 'End_Tie',
    runIdle: 'idle', runRunning: 'running', runReplaying: 'replaying', runFinished: 'finished', runError: 'error',
    kindKill: 'kill', kindSave: 'save', kindQuery: 'query', kindVote: 'vote',
    kindSpeech: 'speech', kindGeneric: 'generic',
  },
};
let lang = 'zh';

function L(key, vars) {
  const table = I18N[lang] || I18N.zh;
  let text = table[key] != null ? table[key] : (I18N.en[key] != null ? I18N.en[key] : key);
  if (vars) for (const [name, value] of Object.entries(vars)) text = text.split(`{${name}}`).join(value);
  return text;
}

const JOB_KEY = { Wolf: 'jobWolf', Prophet: 'jobProphet', Witch: 'jobWitch', Civilian: 'jobCivilian' };
const STATE_KEY = { Alive: 'stateAlive', Dead: 'stateDead', Exit: 'stateExit' };
const STAGE_KEY = {
  Initializing: 'stageInit', Finished_Initializing: 'stageReady', Night: 'stageNight', Day: 'stageDay',
  End_Civilian_Win: 'endCivilian', End_Wolf_Win: 'endWolf', End_Tie: 'endTie',
};
const RUN_KEY = { idle: 'runIdle', running: 'runRunning', replaying: 'runReplaying',
                  finished: 'runFinished', error: 'runError' };
const KIND_KEY = { kill: 'kindKill', save: 'kindSave', query: 'kindQuery', vote: 'kindVote',
                   speech: 'kindSpeech', generic: 'kindGeneric' };

const seatName = n => (lang === 'zh' ? `玩家${n}` : `P${n}`);
const jobName = job => L(JOB_KEY[job] || job);
const stateName = state => L(STATE_KEY[state] || state);
const stageName = stage => L(STAGE_KEY[stage] || stage);
const runStateName = state => L(RUN_KEY[state] || state);
const kindName = kind => L(KIND_KEY[kind] || kind);

function refreshText() {
  for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = L(node.dataset.i18n);
  for (const node of document.querySelectorAll('[data-i18n-placeholder]')) {
    node.placeholder = L(node.dataset.i18nPlaceholder);
  }
  document.title = L('title');
  el('lang').value = lang;
}

function setLanguage(code) {
  lang = I18N[code] ? code : 'zh';
  refreshText();
  renderSeats();
  refreshBoard();
  if (pending && lastPrompt) showPrompt(lastPrompt);
  else clearPrompt();
}

// Roles are secret: the engine embeds them in its prompt text (translated), so
// anything that is not the prompt being answered right now gets this treatment.
const ROLE_TAGS = ['[Wolf]', '[Prophet]', '[Witch]', '[狼人]', '[预言家]', '[女巫]'];

function maskedRoleTags(text) {
  if (revealJobs) return text;             // the operator asked to see everything
  const hidden = L('role');
  let out = text;
  for (const tag of ROLE_TAGS) out = out.split(tag).join(hidden);
  return out;
}

function maskPromptLine() {
  if (!lastPromptLine) return;
  lastPromptLine.textContent = maskedRoleTags(lastPromptText);
  lastPromptLine.classList.add('masked');
  lastPromptLine = null;
  lastPromptText = '';
}

// -- seats and model settings ---------------------------------------------
let seats = {};
let showPrompts = false;
let revealJobs = false;
// Every event we have rendered, kept so a display toggle can rebuild the
// transcript locally instead of asking the server to resend it.
let eventLog = [];

function updateSetupSummary(model) {
  const values = Object.values(seats);
  const llm = values.filter(v => v === 'llm').length;
  const total = values.length || 6;
  el('setup-summary').textContent =
    `${L('setup')} — ` + L('summary', { human: total - llm, model: llm }) + (model ? ` · ${model}` : '');
}

function renderSeats() {
  const wrap = el('seat-buttons');
  wrap.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const isLlm = seats[i] === 'llm';
    const button = document.createElement('button');
    button.className = 'seat' + (isLlm ? ' llm' : '');
    button.textContent = `${seatName(i)} ${isLlm ? L('modelSeat') : L('human')}`;
    button.onclick = () => {
      seats[i] = isLlm ? 'human' : 'llm';
      renderSeats();
      refreshBoard();
      send({ type: 'seats', seats });
    };
    wrap.appendChild(button);
  }
  updateSetupSummary(el('llm-model').value.trim());
}

function renderLlmConfig(config) {
  if (!config) return;
  el('llm-kind').value = config.kind || 'openai';
  el('llm-base').value = config.base_url || '';
  el('llm-model').value = config.model || '';
  // Never echo the key back: only report whether the server holds one.
  el('llm-key').value = '';
  el('llm-key').placeholder = config.has_key ? L('keyStored') : L('keyEnv');
  updateSetupSummary(config.model);
}

const WIN_KEY = { Civilians: 'endCivilian', Wolves: 'endWolf', Tie: 'endTie' };

function renderReplays(files) {
  const select = el('replay-files');
  const previous = select.value;
  select.innerHTML = '';
  if (!files || !files.length) {
    const option = document.createElement('option');
    option.textContent = L('noExports');
    option.value = '';
    select.appendChild(option);
    return;
  }
  for (const file of files) {
    const option = document.createElement('option');
    option.value = file.name;
    const winner = file.winner ? L(WIN_KEY[file.winner] || file.winner) : '';
    option.textContent = [
      `seed ${file.seed}`,
      winner,
      file.complete ? '' : '…',
      L('cycle', { n: file.cycles }),
      L('steps', { n: file.steps }),
    ].filter(Boolean).join(' · ');
    option.title = `${file.name}  ${file.exported_at}`;
    select.appendChild(option);
  }
  if (previous && files.some(f => f.name === previous)) select.value = previous;
}

function llmPayload() {
  return {
    kind: el('llm-kind').value,
    base_url: el('llm-base').value.trim(),
    model: el('llm-model').value.trim(),
    api_key: el('llm-key').value,
  };
}

function atBottom() {
  return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60;
}

function addLine(text, cls = '') {
  const stick = atBottom();
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.textContent = text;
  logEl.appendChild(div);
  if (stick) logEl.scrollTop = logEl.scrollHeight;
  return div;
}

function setStatus(text, state) {
  statusEl.textContent = text;
  statusEl.className = 'pill' + (state ? ' ' + state : '');
}

function renderBoard(players) {
  lastPlayers = players || [];
  boardEl.innerHTML = '';
  for (const p of lastPlayers) {
    const revealed = revealJobs || p.id === activePlayer;
    const card = document.createElement('div');
    card.className = 'card' + (revealed ? ' active' : '');
    card.dataset.state = p.state;
    // Only tag data-job while revealed, otherwise the CSS rule for wolves would
    // colour a concealed card red and give the role away anyway.
    if (revealed) card.dataset.job = p.job;
    const badge = seats[p.id] === 'llm' ? '<span class="badge">LLM</span>' : '';
    card.innerHTML = `<span class="pid">${seatName(p.id)}</span>
                      <span class="job${revealed ? '' : ' concealed'}">${revealed ? jobName(p.job) : '???'}</span>
                      ${badge}
                      <span class="state">${stateName(p.state)}</span>`;
    boardEl.appendChild(card);
  }
}

function refreshBoard() {
  renderBoard(lastPlayers);
}

function clearPrompt() {
  barEl.innerHTML = `<span class="waiting">${L('waiting')}</span>`;
}

function send(payload) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(payload));
}

function answer(value) {
  if (!pending) return;
  pending = false;
  clearPrompt();
  send({ type: 'answer', value: String(value) });
}

function maybeAutoplay() {
  // Also called when the checkbox is toggled, so enabling it answers a prompt
  // that is already on screen instead of waiting for the next one.
  if (!pending || replaying || !lastPrompt || !el('autoplay').checked) return;
  const ev = lastPrompt;
  window.setTimeout(() => {
    if (!pending || replaying || !el('autoplay').checked) return;
    if (!ev.choices) answer(L('autoSpeech'));
    else if (ev.choices.length) answer(ev.choices[0]);
    else answer('');
  }, 120);
}

function showPrompt(ev) {
  // Only a human seat expects the browser to answer; model and replay seats
  // resolve their own input, so they must not arm autoplay or the buttons.
  const controller = ev.controller || 'human';
  pending = controller === 'human';
  activePlayer = ev.player;
  lastPrompt = ev;
  refreshBoard();
  barEl.innerHTML = '';

  const title = document.createElement('span');
  title.className = 'prompt-title';
  title.textContent = `${seatName(ev.player)} · ${ev.prompt}`;
  barEl.appendChild(title);

  if (controller !== 'human') {
    const note = document.createElement('span');
    note.className = 'waiting';
    note.textContent = controller === 'llm' ? L('modelDeciding') : L('replaying');
    barEl.appendChild(note);
    return;
  }

  const choices = document.createElement('div');
  choices.className = 'choices';

  if (ev.choices) {
    for (const id of ev.choices) {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = id;
      b.onclick = () => answer(id);
      choices.appendChild(b);
    }
    if (!ev.required) {
      const skip = document.createElement('button');
      skip.textContent = ev.key === 'ID' ? L('skipGiveUp')
        : (ev.key === 'save' ? L('skipSave') : (ev.key === 'kill' ? L('skipKill') : `${L('skip')} ${ev.key}`));
      skip.onclick = () => answer('');
      choices.appendChild(skip);
    }
    barEl.appendChild(choices);
  } else {
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = L('message');
    const go = document.createElement('button');
    go.className = 'primary';
    go.textContent = L('send');
    const submit = () => { if (input.value.trim()) answer(input.value.trim()); };
    go.onclick = submit;
    input.onkeydown = e => { if (e.key === 'Enter') submit(); };
    barEl.appendChild(input);
    barEl.appendChild(go);
    input.focus();
  }

  maybeAutoplay();
}

function rebuild(events) {
  // Replay a stored transcript from the top. `source` is a copy because apply()
  // repopulates eventLog while this loop runs.
  const source = events.slice();
  logEl.innerHTML = '';
  boardEl.innerHTML = '';
  eventLog = [];
  lastPromptLine = null;
  lastPromptText = '';
  lastPrompt = null;
  pending = false;
  activePlayer = null;
  for (const event of source) apply(event, true);
}

function apply(ev, record = true) {
  if (ev.kind === 'language') {
    setLanguage(ev.value);
    return;
  }
  if (ev.kind === 'reset') {
    logEl.innerHTML = '';
    boardEl.innerHTML = '';
    eventLog = [];
    lastPromptLine = null;
    lastPromptText = '';
    lastPrompt = null;
    activePlayer = null;
    pending = false;
    clearPrompt();
    return;
  }
  if (record) eventLog.push(ev);
  switch (ev.kind) {
    case 'log':
      addLine(ev.text);
      break;
    case 'history':
      addLine(ev.text, 'history');
      break;
    case 'prompt':
      maskPromptLine();               // whoever was operating keeps their secret
      lastPromptText = `> [${seatName(ev.player)}] ${ev.prompt}`;
      lastPromptLine = addLine(lastPromptText, 'prompt');
      showPrompt(ev);
      break;
    case 'answer':
      addLine(`  = ${ev.value === '' ? L('blank') : ev.value}`, 'answer');
      maskPromptLine();
      pending = false;
      activePlayer = null;
      refreshBoard();
      clearPrompt();
      break;
    case 'notice':
      addLine(`! ${ev.text}`, 'notice');
      break;
    case 'thinking':
      addLine(`  … ${seatName(ev.player)} ${L('thinking')} (${kindName(ev.label)})`, 'reasoning');
      break;
    case 'decision': {
      const verb = ev.label === 'speech'
        ? L('says', { text: ev.value })
        : L('chose', { value: ev.value === '' ? L('pass') : ev.value });
      addLine(`  ↳ ${seatName(ev.player)} ${verb}  [${kindName(ev.label)}]`, 'decision');
      if (ev.reasoning) addLine(`    ${L('reasoning')}${ev.reasoning}`, 'reasoning');
      if (ev.speech && ev.label !== 'speech') addLine(`    ${L('says', { text: ev.speech })}`, 'speech');
      if (ev.note) addLine(`    ! ${ev.note}`, 'notice');
      break;
    }
    case 'llm-error':
      addLine(`! model error: ${ev.text}`, 'notice');
      break;
    case 'llm-request':
      if (showPrompts) {
        addLine(`— prompt sent for P${ev.viewer} (attempt ${ev.attempt}) —\n${ev.system}\n\n${ev.user}`, 'promptdump');
      }
      break;
    case 'llm-response':
      if (showPrompts) addLine(`— raw reply (attempt ${ev.attempt}) —\n${ev.text}`, 'promptdump');
      break;
    case 'seats':
      seats = ev.seats || {};
      renderSeats();
      refreshBoard();
      break;
    case 'llm-config':
      renderLlmConfig(ev.config);
      break;
    case 'replays':
      renderReplays(ev.files);
      break;
    case 'options':
      showPrompts = !!ev.show_prompts;
      revealJobs = !!ev.reveal_jobs;
      el('show-prompts').checked = showPrompts;
      el('reveal-jobs').checked = revealJobs;
      break;
    case 'status':
      replaying = ev.state === 'replaying';
      seedEl.textContent = ev.seed != null ? `${L('seed')} ${ev.seed}` : '';
      setStatus([stageName(ev.stage), L('cycle', { n: ev.cycles }), runStateName(ev.state), ev.message]
        .filter(Boolean).join(' · '), ev.state);
      renderBoard(ev.players);
      if (ev.message) addLine(`— ${ev.message}`, 'status');
      if (ev.state === 'finished' || ev.state === 'error') {
        pending = false;
        activePlayer = null;
        maskPromptLine();             // nobody is operating once the game ends
        refreshBoard();
        clearPrompt();
      }
      break;
    case 'snapshot':
      setLanguage(ev.language || 'zh');
      seats = ev.seats || {};
      showPrompts = !!ev.show_prompts;
      revealJobs = !!ev.reveal_jobs;
      el('show-prompts').checked = showPrompts;
      el('reveal-jobs').checked = revealJobs;
      renderSeats();
      renderLlmConfig(ev.llm);
      renderReplays(ev.replays);
      seedEl.textContent = ev.seed != null ? `${L('seed')} ${ev.seed}` : '';
      setStatus([stageName(ev.stage), L('cycle', { n: ev.cycles }), runStateName(ev.status), ev.message]
        .filter(Boolean).join(' · '), ev.status);
      rebuild(ev.events || []);
      if (ev.llm_error) addLine(`! ${ev.llm_error}`, 'notice');
      break;
  }
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  socket = ws;
  ws.onmessage = m => apply(JSON.parse(m.data));
  ws.onclose = () => {
    setStatus('disconnected · retrying', 'error');
    el('new').disabled = el('replay').disabled = true;
    window.setTimeout(connect, 1500);
  };
  ws.onopen = () => {
    el('new').disabled = el('replay').disabled = false;
  };
}

el('new').onclick = () => {
  const raw = el('seed-input').value.trim();
  send({ type: 'start', seed: raw || null });
};
el('replay').onclick = () => {
  send({ type: 'replay', delay: Number(el('delay').value) || 0, seed: el('seed-input').value.trim() || null });
};
el('autoplay').onchange = maybeAutoplay;
el('export').onclick = () => send({ type: 'export' });
el('replay-file').onclick = () => {
  const name = el('replay-files').value;
  if (name) send({ type: 'replay-file', name });
};
el('lang').onchange = () => send({ type: 'language', value: el('lang').value });

el('llm-test').onclick = () => send({ type: 'llm-test' });
function publishOptions() {
  send({ type: 'options', show_prompts: el('show-prompts').checked,
         reveal_jobs: el('reveal-jobs').checked });
}
el('show-prompts').onchange = () => { showPrompts = el('show-prompts').checked; publishOptions(); };
el('reveal-jobs').onchange = () => {
  revealJobs = el('reveal-jobs').checked;
  publishOptions();
  rebuild(eventLog);            // re-render the backscroll under the new rule
};
for (const field of ['llm-kind', 'llm-model', 'llm-base', 'llm-key']) {
  el(field).addEventListener('change', () => send({ type: 'llm', config: llmPayload() }));
}

refreshText();
clearPrompt();
renderSeats();
renderReplays([]);
connect();
</script>
</body>
</html>
